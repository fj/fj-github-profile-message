name: Paint profile message
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: paint
jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: fj/github-profile-message@main
        with:
          author-name: John Feminella
          author-email: 57813+fj@users.noreply.github.com
          commits-per-pixel: 120
